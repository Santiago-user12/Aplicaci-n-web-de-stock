services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stockpilot
      MYSQL_USER: stockpilot
      MYSQL_PASSWORD: stockpilot_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
  web:
    build: .
    command: sh -c 'python manage.py migrate && python manage.py runserver 0.0.0.0:8000'
    ports:
      - '8000:8000'
    environment:
      DEBUG: 'True'
      DB_ENGINE: mysql
      DB_NAME: stockpilot
      DB_USER: stockpilot
      DB_PASSWORD: stockpilot_dev
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      - mysql
volumes:
  mysql_data:
