{% extends 'base.html' %}{% block title %}Nueva compra · StockPilot{% endblock %}{% block heading %}Nueva compra{% endblock %}{% block content %}<form method="post" class="panel form">{% csrf_token %}<div class="form-grid"><div class="field"><label>Producto</label><select name="product" required>{% for product in products %}<option value="{{ product.id }}">{{ product.name }} · {{ product.sku }}</option>{% endfor %}</select></div><div class="field"><label>Proveedor</label><select name="supplier"><option value="">Sin proveedor</option>{% for supplier in suppliers %}<option value="{{ supplier.id }}">{{ supplier.name }}</option>{% endfor %}</select></div><div class="field"><label>Depósito de ingreso</label><select name="warehouse" required>{% for warehouse in warehouses %}<option value="{{ warehouse.id }}">{{ warehouse.name }}</option>{% endfor %}</select></div><div class="field"><label>Cantidad</label><input name="quantity" type="number" step="0.001" min="0.001" required></div><div class="field"><label>Costo unitario</label><input name="unit_cost" type="number" step="0.01" min="0" required></div></div><div class="field"><label>Notas</label><textarea name="notes" rows="3"></textarea></div><div class="actions"><button class="button">Registrar compra</button><a class="button secondary" href="{% url 'dashboard' %}">Cancelar</a></div></form>{% endblock %}
