{% extends 'base.html' %}{% block title %}Registrar movimiento · StockPilot{% endblock %}{% block heading %}Registrar movimiento{% endblock %}{% block content %}<form method="post" class="panel form">{% csrf_token %}<div class="field"><label>Producto</label><select name="product" required><option value="">Seleccionar...</option>{% for product in products %}<option value="{{ product.id }}">{{ product.name }} · {{ product.sku }}</option>{% endfor %}</select></div><div class="form-grid"><div class="field"><label>Depósito / sucursal</label><select name="warehouse" required>{% for warehouse in warehouses %}<option value="{{ warehouse.id }}">{{ warehouse.name }}</option>{% empty %}<option>Creá un depósito desde Administración</option>{% endfor %}</select></div><div class="field"><label>Tipo</label><select name="movement_type">{% for value,label in movement_types %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div class="field"><label>Cantidad</label><input name="quantity" type="number" step="0.001" min="0.001" required></div><div class="field"><label>Costo unitario (entradas)</label><input name="unit_cost" type="number" step="0.01" min="0" value="0"></div></div><div class="field"><label>Notas</label><textarea name="notes" rows="3"></textarea></div><button class="button">Aplicar movimiento</button></form>{% endblock %}
