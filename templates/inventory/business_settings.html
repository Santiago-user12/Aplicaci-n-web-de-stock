{% extends 'base.html' %}{% block title %}Configuración · StockPilot{% endblock %}{% block heading %}Configuración del negocio{% endblock %}{% block content %}<form method="post" class="panel form">{% csrf_token %}<div class="form-grid"><div class="field"><label>Nombre del negocio</label><input name="name" value="{{ business.name }}" required></div><div class="field"><label>Nombre visible de la aplicación</label><input name="brand_name" value="{{ business.brand_name }}" required></div><div class="field"><label>Moneda</label><input name="currency" value="{{ business.currency }}" maxlength="3" required></div><div class="field"><label>URL del logo</label><input name="logo_url" type="url" value="{{ business.logo_url }}" placeholder="https://..."> </div><div class="field"><label>Color principal</label><input name="primary_color" type="color" value="{{ business.primary_color }}"></div><div class="field"><label>Color secundario</label><input name="secondary_color" type="color" value="{{ business.secondary_color }}"></div></div><label style="display:flex;gap:9px;align-items:center;margin:8px 0 18px"><input type="checkbox" name="dark_theme" {% if business.dark_theme %}checked{% endif %}> Usar tema oscuro</label><button class="button">Guardar configuración</button></form>{% endblock %}
