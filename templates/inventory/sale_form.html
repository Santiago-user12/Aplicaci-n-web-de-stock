{% extends 'base.html' %}{% block title %}Nueva venta · StockPilot{% endblock %}{% block heading %}Nueva venta{% endblock %}{% block content %}<form method="post" class="panel form">{% csrf_token %}<div class="form-grid"><div class="field"><label>Producto</label><select name="product" required>{% for product in products %}<option value="{{ product.id }}">{{ product.name }} · $ {{ product.sale_price }}</option>{% endfor %}</select></div><div class="field"><label>Depósito / sucursal</label><select name="warehouse" required>{% for warehouse in warehouses %}<option value="{{ warehouse.id }}">{{ warehouse.name }}</option>{% endfor %}</select></div><div class="field"><label>Cantidad</label><input name="quantity" type="number" step="0.001" min="0.001" value="1" required></div><div class="field"><label>Cliente opcional</label><select name="customer"><option value="">Consumidor final</option>{% for customer in customers %}<option value="{{ customer.id }}">{{ customer.name }}</option>{% endfor %}</select></div></div><label style="display:flex;gap:9px;align-items:center;margin:8px 0 18px"><input type="checkbox" name="consume_recipe"> Descontar automáticamente los ingredientes de la receta</label><div class="field"><label>Notas para despacho</label><textarea name="notes" rows="3" placeholder="Sin cebolla, mesa 4, envío..."></textarea></div><div class="actions"><button class="button">Confirmar venta</button><a class="button secondary" href="{% url 'dashboard' %}">Cancelar</a></div></form>{% endblock %}
