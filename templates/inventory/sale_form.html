{% extends 'base.html' %}{% block title %}Nueva venta · StockPilot{% endblock %}{% block heading %}Nueva venta{% endblock %}{% block content %}<form method="post" class="panel form">{% csrf_token %}<div id="sale-lines"><div class="sale-line" style="border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px"><div class="form-grid"><div class="field"><label>Producto</label><select name="product" required onchange="updateTotal()">{% for product in products %}<option value="{{ product.id }}" data-price="{{ product.sale_price }}">{{ product.name }} · $ {{ product.sale_price }}</option>{% endfor %}</select></div><div class="field"><label>Cantidad</label><input name="quantity" type="number" step="0.001" min="0.001" value="1" required oninput="updateTotal()"></div><div class="field"><label>Comentario del producto</label><input name="comment" maxlength="240" placeholder="Ej.: sin cebolla, talle, color..."></div><div class="field"><label>Subtotal</label><output class="line-total">$ 0.00</output></div></div><button type="button" class="button secondary remove-line" onclick="removeLine(this)" style="padding:7px 10px">Eliminar producto</button></div></div><button type="button" class="button secondary" onclick="addLine()" style="margin-bottom:18px">+ Agregar producto</button><div class="form-grid"><div class="field"><label>Depósito / sucursal</label><select name="warehouse" required>{% for warehouse in warehouses %}<option value="{{ warehouse.id }}">{{ warehouse.name }}</option>{% endfor %}</select></div><div class="field"><label>Cliente opcional</label><select name="customer"><option value="">Consumidor final</option>{% for customer in customers %}<option value="{{ customer.id }}">{{ customer.name }}</option>{% endfor %}</select></div><div class="field"><label>Método de pago</label><select name="payment_method"><option value="">Sin especificar</option>{% for method in payment_methods %}<option value="{{ method.id }}">{{ method.name }}</option>{% endfor %}</select></div></div><label style="display:flex;gap:9px;align-items:center;margin:8px 0 18px"><input type="checkbox" name="consume_recipe"> Descontar automáticamente los ingredientes de las recetas</label><div class="field"><label>Notas generales para despacho</label><textarea name="notes" rows="3" placeholder="Mesa 4, envío..."></textarea></div><div class="card" style="display:flex;justify-content:space-between;align-items:center;margin:16px 0"><span class="metric-label">TOTAL DE LA VENTA</span><strong id="sale-total" style="font-size:28px">$ 0.00</strong></div><div class="actions"><button class="button">Confirmar venta</button><a class="button secondary" href="{% url 'dashboard' %}">Cancelar</a></div></form><script>function updateTotal(){let total=0;document.querySelectorAll('.sale-line').forEach(row=>{const select=row.querySelector('select[name="product"]');const qty=parseFloat(row.querySelector('input[name="quantity"]').value)||0;const price=parseFloat(select?.selectedOptions[0]?.dataset.price)||0;const subtotal=qty*price;row.querySelector('.line-total').textContent='$ '+subtotal.toFixed(2);total+=subtotal});document.getElementById('sale-total').textContent='$ '+total.toFixed(2)}function addLine(){const first=document.querySelector('.sale-line');const row=first.cloneNode(true);row.querySelector('input[name="quantity"]').value=1;row.querySelector('input[name="comment"]').value='';row.querySelector('select[name="product"]').selectedIndex=0;document.getElementById('sale-lines').appendChild(row);updateTotal()}function removeLine(button){const rows=document.querySelectorAll('.sale-line');if(rows.length>1){button.closest('.sale-line').remove();updateTotal()}}updateTotal()</script>{% endblock %}
