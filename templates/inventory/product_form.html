{% extends 'base.html' %}{% block title %}Nuevo producto · StockPilot{% endblock %}{% block heading %}Nuevo producto{% endblock %}{% block content %}<form method="post" class="panel form">{% csrf_token %}<div class="form-grid"><div class="field"><label>SKU *</label><input name="sku" required></div><div class="field"><label>Nombre *</label><input name="name" required></div><div class="field"><label>Categoría</label><input name="category" value="General"></div><div class="field"><label>Unidad</label><input name="unit_label" value="unidad"></div><div class="field"><label>Costo actual</label><input name="cost" type="number" step="0.01" value="0"></div><div class="field"><label>Precio de venta</label><input name="sale_price" type="number" step="0.01" value="0"></div><div class="field"><label>Stock mínimo</label><input name="min_stock" type="number" step="0.001" value="0"></div><div class="field"><label>Método de costo</label><select name="cost_method"><option value="weighted_average">Promedio ponderado</option><option value="fifo">FIFO</option><option value="last_cost">Último costo</option></select></div></div><div class="actions"><button class="button">Guardar producto</button><a class="button secondary" href="{% url 'products' %}">Cancelar</a></div></form>{% endblock %}
