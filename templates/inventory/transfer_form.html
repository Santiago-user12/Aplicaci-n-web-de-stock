{% extends 'base.html' %}{% block title %}Transferir stock · StockPilot{% endblock %}{% block heading %}Transferir stock{% endblock %}{% block content %}<form method="post" class="panel form">{% csrf_token %}<div class="field"><label>Producto</label><select name="product" required>{% for product in products %}<option value="{{ product.id }}">{{ product.name }} · {{ product.sku }}</option>{% endfor %}</select></div><div class="form-grid"><div class="field"><label>Depósito origen</label><select name="source" required>{% for warehouse in warehouses %}<option value="{{ warehouse.id }}">{{ warehouse.name }}</option>{% endfor %}</select></div><div class="field"><label>Depósito destino</label><select name="target" required>{% for warehouse in warehouses %}<option value="{{ warehouse.id }}">{{ warehouse.name }}</option>{% endfor %}</select></div><div class="field"><label>Cantidad</label><input name="quantity" type="number" step="0.001" min="0.001" required></div></div><div class="field"><label>Notas</label><textarea name="notes" rows="3"></textarea></div><div class="actions"><button class="button">Confirmar transferencia</button><a class="button secondary" href="{% url 'dashboard' %}">Cancelar</a></div></form>{% endblock %}
