<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña · StockPilot</title><link rel="stylesheet" href="/static/css/app.css"></head><body style="display:grid;place-items:center"><form method="post" class="panel form" style="width:min(420px,90vw)"><div class="brand" style="margin-bottom:24px"><span class="brand-mark">S</span><span>StockPilot</span></div><h1 style="font-size:25px">¿Olvidaste tu contraseña?</h1><p style="color:var(--muted)">Ingresá tu correo y te enviaremos un enlace para crear una nueva contraseña.</p>{% csrf_token %}<div class="field"><label>Correo electrónico</label>{{ form.email }}</div><button class="button" style="width:100%">Enviar enlace</button><div style="text-align:center;margin-top:16px"><a class="link" href="{% url 'login' %}">Volver al inicio de sesión</a></div></form></body></html>
