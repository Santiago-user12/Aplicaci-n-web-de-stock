<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · StockPilot</title><link rel="stylesheet" href="/static/css/app.css"></head><body style="display:grid;place-items:center"><form method="post" class="panel form" style="width:min(420px,90vw)"><div class="brand" style="margin-bottom:24px"><span class="brand-mark">S</span><span>StockPilot</span></div><h1 style="font-size:25px">Ingresar al sistema</h1>{% csrf_token %}<div class="field"><label>Usuario</label><input name="username" autofocus required></div><div class="field"><label>Contraseña</label><input name="password" type="password" required></div>{% if form.errors %}<p class="low">Usuario o contraseña incorrectos.</p>{% endif %}<button class="button" style="width:100%">Ingresar</button></form></body></html>
